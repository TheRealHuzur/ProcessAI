<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logbuch · ProzessPilot</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/portal.css">
  <style>
    /* Inhalt mittig: Breite der Karte plus Seitenabstand von main */
    main { max-width: 652px; }
    .ablage {
      display: block;
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 28px 16px;
      text-align: center;
      background: var(--surface-2);
      cursor: pointer;
      margin: 0;
      font-size: 15px;
      font-weight: 400;
      color: var(--text);
    }
    .ablage.ueber { border-color: var(--sky); background: rgba(2, 132, 199, 0.06); }
    .ablage.gewaehlt { border-style: solid; border-color: var(--sky); }
    .ablage strong { display: block; font-size: 16px; margin-bottom: 4px; overflow-wrap: anywhere; }
    .ablage p { margin: 0; color: var(--text-muted); font-size: 14px; overflow-wrap: anywhere; }
    .erstellen .btn-primaer { width: 100%; margin-top: 18px; padding: 11px 14px; font-size: 15px; }
  </style>
</head>
<body>
  <header class="kopf">
    <a class="marke" href="/">Prozess<span>Pilot</span></a>
    <div class="kopf-rechts">
      <span id="mandant-name"></span>
      <a class="btn btn-zweit btn-klein" href="/">Übersicht</a>
      <button class="btn btn-zweit btn-klein" id="btn-abmelden" type="button">Abmelden</button>
    </div>
  </header>

  <main>
    <h1>Logbuch</h1>
    <p class="unterzeile">BPMN-Datei hochladen, Titel eingeben, Handbuch erstellen.</p>

    <form class="karte erstellen" id="form-erstellen">
      <label class="ablage" id="ablage" for="datei">
        <strong id="ablage-titel">BPMN-Datei hier ablegen oder auswählen</strong>
        <p id="ablage-text">Export aus ADONIS, PICTURE oder einem anderen Werkzeug, Endung .bpmn oder .xml. Auch mehrere Dateien, etwa Haupt- und Unterdiagramme.</p>
      </label>
      <input type="file" id="datei" accept=".bpmn,.xml" multiple hidden>

      <label for="titel">Titel des Handbuchs</label>
      <input type="text" id="titel" maxlength="150" placeholder="z. B. Antrag auf Teilzeit bearbeiten" required>

      <button class="btn btn-primaer" id="btn-erstellen" type="submit" disabled>Handbuch erstellen</button>
      <div class="meldung" id="meldung" hidden></div>
    </form>
  </main>

  <div class="fuss">Wissen und Werkzeug · Testversion</div>

  <script src="/portal.js"></script>
  <script src="handbuch.js"></script>
</body>
</html>
