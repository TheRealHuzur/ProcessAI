<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logbuch · ProzessPilot</title>
  <meta name="robots" content="noindex, nofollow">
  <!-- Gestaltung nach docs/styleguide/STYLEGUIDE_ProzessPilot.md -->
  <link rel="stylesheet" href="/stil/prozesspilot.css">
  <style>
    .erstellen .pp-card__action { padding-top: 20px; }
    .erstellen .pp-message { margin-top: 16px; }
    .rueckmeldung { margin-top: 28px; }
    .rueckmeldung h2 { font-size: 24px; margin: 0 0 6px; }
    .rueckmeldung p { margin: 0; }
    .rm-knoepfe { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 18px; }
    .rm-hinweis { margin-top: 18px; }
    .rm-hinweis textarea { min-height: 110px; resize: vertical; font: inherit; }
    .rm-hinweis .pp-btn { margin-top: 14px; }
    .rueckmeldung .pp-message { margin-top: 16px; }
  </style>
</head>
<body>
<div class="pp-page">

  <header class="pp-header">
    <div class="pp-container pp-header__inner">
      <a href="/" class="pp-wordmark">Prozess<span>Pilot</span></a>
      <div class="pp-header__right">
        <span class="pp-org" id="mandant-name"></span>
        <a href="/" class="pp-btn pp-btn--text">Übersicht</a>
        <button type="button" class="pp-btn pp-btn--text" id="btn-abmelden">Abmelden</button>
      </div>
    </div>
  </header>

  <section class="pp-band">
    <div class="pp-container pp-container--narrow pp-band__inner">
      <span class="pp-eyebrow">Logbuch</span>
      <h1>Handbuch erstellen</h1>
      <p class="pp-band__lead">BPMN-Datei hochladen, Titel eingeben, Handbuch erstellen.</p>
    </div>
  </section>

  <main class="pp-main">
    <div class="pp-container pp-container--narrow">
      <form class="pp-card pp-card--plain pp-form erstellen" id="form-erstellen">
        <label class="pp-dropzone" id="ablage" for="datei">
          <strong id="ablage-titel">BPMN-Datei hier ablegen oder auswählen</strong>
          <p id="ablage-text">Export aus ADONIS, PICTURE oder einem anderen Werkzeug, Endung .bpmn oder .xml. Auch mehrere Dateien, etwa Haupt- und Unterdiagramme.</p>
          <input type="file" id="datei" accept=".bpmn,.xml" multiple class="pp-visually-hidden">
        </label>

        <label class="pp-label" for="titel">Titel des Handbuchs</label>
        <input class="pp-field" type="text" id="titel" maxlength="150" placeholder="z. B. Antrag auf Teilzeit bearbeiten" required>

        <div class="pp-card__action">
          <button class="pp-btn pp-btn--primary" id="btn-erstellen" type="submit" disabled>Handbuch erstellen</button>
        </div>
        <div id="meldung" hidden></div>
      </form>

      <section class="pp-card pp-card--plain rueckmeldung" id="rueckmeldung" aria-labelledby="rm-frage" hidden>
        <h2 id="rm-frage">Passt das Handbuch?</h2>
        <p class="pp-small">Ihre Rückmeldung hilft uns, das Logbuch zu verbessern.</p>
        <div class="rm-knoepfe" id="rm-knoepfe">
          <button class="pp-btn pp-btn--primary" type="button" id="rm-ja">Ja, passt</button>
          <button class="pp-btn pp-btn--primary" type="button" id="rm-nein">Nicht ganz</button>
        </div>
        <form class="pp-form rm-hinweis" id="rm-form" hidden>
          <label class="pp-label" for="rm-text" id="rm-label">Was sollten wir verbessern? (freiwillig)</label>
          <textarea class="pp-field" id="rm-text" maxlength="2000"></textarea>
          <button class="pp-btn pp-btn--primary" type="submit" id="rm-senden">Hinweis senden</button>
        </form>
        <div id="rm-meldung" hidden></div>
      </section>
    </div>
  </main>

  <footer class="pp-footer">
    <div class="pp-container pp-footer__inner">
      <img src="/stil/logo-wissen-und-werkzeug.png" alt="Wissen und Werkzeug" width="150" height="50">
      <span>Testversion</span>
    </div>
  </footer>

</div>

<script src="/portal.js"></script>
<script src="handbuch.js"></script>
</body>
</html>
